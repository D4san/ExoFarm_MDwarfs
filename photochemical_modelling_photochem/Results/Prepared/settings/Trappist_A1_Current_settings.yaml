atmosphere-grid:
  bottom: 0.0
  top: atmospherefile
  number-of-layers: 120
planet:
  planet-mass: 4.13274e+27
  planet-radius: 586785200.0
  surface-albedo: 0.1
  solar-zenith-angle: 48.0
  hydrogen-escape:
    type: diffusion limited
  water:
    fix-water-in-troposphere: false
    relative-humidity: manabe
    gas-rainout: true
    rainfall-rate: 1.0
    tropopause-altitude: 1.1e6
    water-condensation: false
