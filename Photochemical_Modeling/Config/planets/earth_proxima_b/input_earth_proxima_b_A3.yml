# Earth-like analogue under the Proxima Centauri environment (Layer 2,
# life_proxima_b_earthlike). Planet/star/orbit values frozen from the LIFE X
# input catalogue (Carrión-González et al. 2023, A&A 678, A96, Table G.1):
# Rp=1.23 R_E, Mp=1.59 M_E (-> gs=1030.0 cm/s2), a=0.0485 AU (Anglada-Escudé
# et al. 2016), R_star=0.14 R_sun. PT/Kzz = terrestrial control
# (atm_Earth_Jan_Kzz.txt) per docs/life_stage_iii_two_layer_workplan; tidally
# locked geometry convention (f_diurnal=1.0, sl_angle=48 deg) follows the
# accepted TRAPPIST-1e branch. This is a controlled stellar-environment
# experiment, NOT Proxima b's measured atmosphere.
planet:
  name: 'Proxima-b-Extreme'
  Rp: 7.845e8
  gs: 1030.0
  orbit_radius: 0.0485
  sl_angle: 48.0
  f_diurnal: 1.0
  rocky: True
atmosphere:
  atm_type: 'file'
  atm_file: 'atm/atm_Earth_Jan_Kzz.txt'
  P_b: 1.0e6
  P_t: 5.0e-2
  nz: 120
  Kzz_prof: 'file'
  const_mix:
    N2: 0.78
    O2: 0.20
    H2O: 1.0e-6
    CO2: 0.0004
    Ar: 9.34e-3
    SO2: 2.0e-10
star:
  type: 'ProximaCen'
  r_star: 0.14
  sflux_file: 'atm/stellar_flux/ProximaCen_surface.txt'
chemistry:
  network: 'thermo/SNCHO_full_photo_network.txt'
  use_photo: True
  use_botflux: True
  bot_BC_flux_file: 'atm/BC_bot_Earth.txt'
  out_name: 'Proxima_b_A3_Extreme.vul'
